{{- $toc := .TableOfContents -}}
{{- if in $toc "<li>" }}
<aside id="toc-container" class="toc-container" aria-label="目录">
    {{- /* Headings may contain links; strip their nested links from TOC markup. */ -}}
    <div class="toc">{{ replaceRE `<a href="[^#][^"]*">([^<]*)</a>` "$1" $toc | safeHTML }}</div>
</aside>
{{- end }}
